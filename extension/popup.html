<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTINEL-X Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 380px;
      background-color: #0b1120;
      color: #f1f5f9;
      font-size: 12px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .brand span {
      color: #06b6d4;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      font-family: monospace;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .url-display {
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      background: #020617;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #06b6d4;
      color: #020617;
    }
    .btn-primary:hover {
      background: #22d3ee;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .header-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }
    .header-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      background: #020617;
      font-size: 10.5px;
    }
    .header-name {
      font-family: monospace;
      color: #cbd5e1;
    }
    .tag {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9.5px;
      font-weight: 600;
    }
    .tag-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .tag-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .settings-drawer {
      margin-top: 10px;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-label {
      font-size: 10px;
      color: #94a3b8;
      display: block;
      margin-bottom: 3px;
    }
    .input {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 5px 8px;
      color: #e2e8f0;
      font-size: 11px;
    }
    .input:focus {
      outline: none;
      border-color: #06b6d4;
    }
    .notification {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      margin-bottom: 8px;
      display: none;
    }
    .notification-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" width="22" height="22" style="border-radius: 4px; vertical-align: middle;" alt="Logo" />
      SENTINEL<span>-X</span>
    </div>
    <div id="connectionStatus" class="status-badge status-offline">CONNECTING...</div>
  </div>

  <div id="noticeBox" class="notification notification-success"></div>

  <!-- Current Target Scope -->
  <div class="card">
    <div class="card-title">Target Scope Under Test</div>
    <div id="targetUrl" class="url-display">Inspecting active tab...</div>
    <div style="margin-top: 8px;">
      <button id="inspectBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Inspect Page Security
      </button>
    </div>
  </div>

  <!-- Security Audit Results -->
  <div id="resultsCard" class="card" style="display: none;">
    <div class="card-title">Security Posture Findings</div>
    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
      <span style="color: #94a3b8;">Transport Protocol:</span>
      <span id="tlsStatus" style="font-weight: 600;">--</span>
    </div>

    <div class="header-list" id="headerChecks">
      <!-- Injected by popup.js -->
    </div>

    <div style="margin-top: 10px;">
      <button id="saveFindingBtn" class="btn btn-secondary">
        Save Finding to SENTINEL-X
      </button>
    </div>
  </div>

  <!-- Settings Accordion -->
  <div class="settings-drawer">
    <div class="card-title" style="cursor: pointer;" id="toggleSettings">
      ⚙️ Connection Settings ▼
    </div>
    <div id="settingsBody" style="display: none; margin-top: 6px;">
      <div class="form-group">
        <label class="form-label">Backend API URL</label>
        <input type="text" id="backendUrlInput" class="input" value="http://127.0.0.1:8000" />
      </div>
      <div class="form-group">
        <label class="form-label">Agent / Client API Key</label>
        <input type="password" id="apiKeyInput" class="input" placeholder="sx_dev_agent_key_default" />
      </div>
      <button id="saveSettingsBtn" class="btn btn-secondary" style="margin-top: 4px;">Save Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
