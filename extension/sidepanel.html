<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SENTINEL-X Investigation Side Panel</title>
  <style>
    body {
      background: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      font-size: 12px;
    }
    h2 {
      font-size: 14px;
      color: #06b6d4;
      margin-bottom: 8px;
    }
    .panel-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e2e8f0;
      padding: 6px;
      font-size: 11px;
      height: 90px;
      resize: vertical;
      box-sizing: border-box;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
      margin-right: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h2>SENTINEL-X Side Panel</h2>
  
  <div class="panel-card">
    <div style="font-weight: 600; margin-bottom: 6px; color: #94a3b8;">QUICK MITRE ATT&CK REFERENCE</div>
    <div>
      <span class="badge" style="background: rgba(6, 182, 212, 0.2); color: #22d3ee;">T1110 (Brute Force)</span>
      <span class="badge" style="background: rgba(244, 63, 94, 0.2); color: #fb7185;">T1548.003 (Sudo Abuse)</span>
      <span class="badge" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24;">T1053.003 (Cron Persistence)</span>
      <span class="badge" style="background: rgba(168, 85, 247, 0.2); color: #c084fc;">T1562.001 (Security Service Kill)</span>
    </div>
  </div>

  <div class="panel-card">
    <div style="font-weight: 600; margin-bottom: 6px; color: #94a3b8;">ANALYST SCRATCHPAD</div>
    <textarea id="notes" placeholder="Paste IOCs, hashes, or observations..."></textarea>
  </div>

  <script>
    const notes = document.getElementById('notes');
    chrome.storage.local.get(['scratchpad'], (res) => {
      if (res.scratchpad) notes.value = res.scratchpad;
    });
    notes.addEventListener('input', () => {
      chrome.storage.local.set({ scratchpad: notes.value });
    });
  </script>
</body>
</html>
